<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 136 64">
  <!-- the camera from above: back edge at the top; the slot the print comes out of -->
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffab70"/><stop offset="1" stop-color="#ffbb88"/></linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b14f1a" stop-opacity="0"/><stop offset="1" stop-color="#b14f1a" stop-opacity=".3"/></linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 .5  0 0 0 0 .2  0 0 0 0 .05  .3 0 0 0 -.13"/>
    </filter>
  </defs>
  <rect width="136" height="64" fill="url(#top)"/>
  <rect width="136" height="64" filter="url(#grain)"/>
  <!-- the print throws a little shade behind itself -->
  <rect x="34" y="31" width="68" height="10" fill="url(#shade)"/>
  <rect x="33" y="40.4" width="70" height="3.6" rx="1.8" fill="#2a1a10"/>
  <rect x="33" y="43.2" width="70" height=".9" rx=".45" fill="#ffd8bb" fill-opacity=".8"/>
  <!-- strap lug -->
  <rect x="3" y="16" width="9" height="14" rx="3" fill="#e2702f"/>
  <rect x="5" y="19" width="5" height="8" rx="2" fill="#a9481a"/>
</svg>
