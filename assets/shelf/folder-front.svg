<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 102">
  <!-- the front of the folder: shorter, a thumb notch cut in its top edge, score lines at the fold -->
  <defs>
    <linearGradient id="m" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d595"/><stop offset=".6" stop-color="#e8c47c"/><stop offset="1" stop-color="#d6ae64"/></linearGradient>
    <filter id="fibre" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" result="n"/>
      <feColorMatrix in="n" values="0 0 0 0 .42  0 0 0 0 .28  0 0 0 0 .08  .5 0 0 0 -.23" result="c"/>
      <feComposite in="c" in2="SourceAlpha" operator="in" result="t"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="t"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#fibre)">
    <path d="M0 102V0h71a15 15 0 0 0 30 0h71v102z" fill="url(#m)"/>
  </g>
  <path d="M.5 .6h70.4a15.6 15.6 0 0 0 30.2 0h70.4" fill="none" stroke="#fff6da" stroke-opacity=".85" stroke-width="1"/>
  <!-- score lines where it folds -->
  <g fill="none" stroke-width=".7">
    <path d="M0 86.4h172M0 91.4h172M0 96.4h172" stroke="#9c7434" stroke-opacity=".28"/>
    <path d="M0 87.2h172M0 92.2h172M0 97.2h172" stroke="#fff3cf" stroke-opacity=".55"/>
  </g>
</svg>
