<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 104">
  <!-- the left side, in shade: back edge at the left, front at the right; and a sticker -->
  <defs>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c85a22"/><stop offset="1" stop-color="#de6b2c"/></linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="5"/>
      <feColorMatrix values="0 0 0 0 .4  0 0 0 0 .14  0 0 0 0 .03  .3 0 0 0 -.13"/>
    </filter>
  </defs>
  <rect width="64" height="104" fill="url(#side)"/>
  <rect width="64" height="104" filter="url(#grain)"/>
  <path d="M0 84.5h64" stroke="#8f3f14" stroke-opacity=".35"/>
  <!-- battery door -->
  <rect x="9" y="28" width="44" height="50" rx="5" fill="none" stroke="#8f3f14" stroke-opacity=".3"/>
  <!-- AI sticker, slapped on a little crooked -->
  <g transform="rotate(-12 32 50)">
    <circle cx="32.6" cy="50.8" r="13.5" fill="#5a2208" fill-opacity=".25"/>
    <circle cx="32" cy="50" r="13.5" fill="#ffd84d"/>
    <circle cx="32" cy="50" r="11.6" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width=".8"/>
    <text x="29.6" y="55" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#2f2a5a">AI</text>
    <path d="M40.5 40.5q.6 2.6 3.2 3.2-2.6.6-3.2 3.2-.6-2.6-3.2-3.2 2.6-.6 3.2-3.2z" fill="#2f2a5a"/>
  </g>
</svg>
