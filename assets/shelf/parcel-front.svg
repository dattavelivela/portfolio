<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 40">
  <!-- a Rinso order, taped shut: the front of the box -->
  <defs>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.9" fill="#e5392b" fill-opacity=".82"/></pattern>
  </defs>
  <rect width="64" height="40" fill="#2577e1"/>
  <!-- printed: soap bubbles and the wordmark running off the edge -->
  <g fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.1">
    <circle cx="7" cy="9" r="4.5"/><circle cx="14.5" cy="4" r="2.4"/>
  </g>
  <text x="2" y="37" font-family="Georgia,'Times New Roman',serif" font-size="21" fill="#fff" fill-opacity=".94">Rin</text>
  <!-- the size label -->
  <g transform="rotate(-1.5 47 15)">
    <rect x="34.5" y="5.2" width="25" height="19" rx=".8" fill="#14336b" fill-opacity=".25"/>
    <rect x="34" y="4.5" width="25" height="19" rx=".8" fill="#fbfbf8"/>
    <rect x="34" y="4.5" width="25" height="4.6" fill="#ecebe5"/>
    <text x="35.6" y="8.1" font-family="Menlo,Consolas,monospace" font-size="3.6" font-weight="700" fill="#22252f">RN0132SR</text>
    <rect x="34" y="9.1" width="25" height=".35" fill="#22252f" fill-opacity=".4"/>
    <text x="35.6" y="12.6" font-family="Menlo,Consolas,monospace" font-size="2.7" fill="#22252f" fill-opacity=".75">WASH | FOLD</text>
    <rect x="34" y="14" width="25" height=".35" fill="#22252f" fill-opacity=".4"/>
    <text x="35.4" y="21.6" font-family="Helvetica,Arial,sans-serif" font-size="7.4" font-weight="700" fill="#22252f">132</text>
    <path d="M48 16.4h.6v5.8H48zm1.2 0h.4v5.8h-.4zm.9 0h1v5.8h-1zm1.6 0h.4v5.8h-.4zm.9 0h.7v5.8h-.7zm1.3 0h.4v5.8h-.4zm.9 0h1.1v5.8h-1.1zm1.7 0h.4v5.8h-.4zm.8 0h.6v5.8h-.6z" fill="#22252f"/>
  </g>
  <!-- tape, over everything, coming down off the top -->
  <rect x="21" y="0" width="11" height="31" fill="#f6d03c" fill-opacity=".8"/>
  <rect x="21" y="0" width="11" height="31" fill="url(#dots)"/>
  <path d="M21 31l1.6-1 1.3 1.2 1.5-1.1 1.4 1.1 1.6-1.2 1.3 1.1 1.5-1 1.8.9V31z" fill="#f6d03c" fill-opacity=".8"/>
  <rect x="21" y="0" width=".7" height="31" fill="#fff" fill-opacity=".45"/>
</svg>
