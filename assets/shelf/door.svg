<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 224">
<!-- one of the 2,000: a wooden front door, brass 132 for the first 132 orders -->
<defs>
  <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a06839"/><stop offset="1" stop-color="#6e4024"/></linearGradient>
  <linearGradient id="field" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9c6538"/><stop offset="1" stop-color="#7a4829"/></linearGradient>
  <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe29a"/><stop offset=".5" stop-color="#dcaa45"/><stop offset="1" stop-color="#a77826"/></linearGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".42 .011" numOctaves="3" seed="7"/>
    <feColorMatrix values="0 0 0 0 .16  0 0 0 0 .08  0 0 0 0 .02  1.3 0 0 0 -.62"/>
  </filter>
</defs>
<rect width="104" height="224" fill="url(#wood)"/>
<rect x="9.2" y="29.2" width="38.6" height="69.6" fill="#2e1808" fill-opacity=".55"/><path d="M10 30L47 30L42 35L15 35Z" fill="#bf8955"/><path d="M47 30L47 98L42 93L42 35Z" fill="#a7703f"/><path d="M10 98L47 98L42 93L15 93Z" fill="#5a321a"/><path d="M10 30L10 98L15 93L15 35Z" fill="#6a3d21"/><rect x="15" y="35" width="27" height="58" fill="url(#field)"/>
<rect x="56.2" y="29.2" width="38.6" height="69.6" fill="#2e1808" fill-opacity=".55"/><path d="M57 30L94 30L89 35L62 35Z" fill="#bf8955"/><path d="M94 30L94 98L89 93L89 35Z" fill="#a7703f"/><path d="M57 98L94 98L89 93L62 93Z" fill="#5a321a"/><path d="M57 30L57 98L62 93L62 35Z" fill="#6a3d21"/><rect x="62" y="35" width="27" height="58" fill="url(#field)"/>
<rect x="9.2" y="133.2" width="38.6" height="79.6" fill="#2e1808" fill-opacity=".55"/><path d="M10 134L47 134L42 139L15 139Z" fill="#bf8955"/><path d="M47 134L47 212L42 207L42 139Z" fill="#a7703f"/><path d="M10 212L47 212L42 207L15 207Z" fill="#5a321a"/><path d="M10 134L10 212L15 207L15 139Z" fill="#6a3d21"/><rect x="15" y="139" width="27" height="68" fill="url(#field)"/>
<rect x="56.2" y="133.2" width="38.6" height="79.6" fill="#2e1808" fill-opacity=".55"/><path d="M57 134L94 134L89 139L62 139Z" fill="#bf8955"/><path d="M94 134L94 212L89 207L89 139Z" fill="#a7703f"/><path d="M57 212L94 212L89 207L62 207Z" fill="#5a321a"/><path d="M57 134L57 212L62 207L62 139Z" fill="#6a3d21"/><rect x="62" y="139" width="27" height="68" fill="url(#field)"/>
<rect width="104" height="224" filter="url(#grain)"/>
<!-- the number, in brass, with the shadow it throws on the rail -->
<text x="52.8" y="21.6" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13" letter-spacing="1.6" fill="#2e1808" fill-opacity=".45">132</text>
<text x="52" y="20.8" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13" letter-spacing="1.6" fill="url(#brass)" stroke="#8a5f18" stroke-width=".25">132</text>
<!-- letterbox -->
<rect x="35.2" y="108.8" width="34" height="15" rx="1.8" fill="#2e1808" fill-opacity=".4"/>
<rect x="35" y="108" width="34" height="15" rx="1.8" fill="url(#brass)" stroke="#9c6d1f" stroke-width=".5"/>
<rect x="38.5" y="113" width="27" height="4.6" rx="1" fill="#231405"/>
<rect x="38.5" y="117.6" width="27" height="1" fill="#fff3c4" fill-opacity=".55"/>
<!-- rosette and keyhole; the knob itself stands off the door in 3D -->
<circle cx="95.6" cy="123.6" r="4.6" fill="#2e1808" fill-opacity=".35"/>
<circle cx="95" cy="123" r="4.4" fill="url(#brass)" stroke="#9c6d1f" stroke-width=".4"/>
<rect x="92.6" y="131" width="5" height="9" rx="1.2" fill="url(#brass)" stroke="#9c6d1f" stroke-width=".4"/>
<path d="M95.1 133.4a1.1 1.1 0 1 1-.01 0zM94.6 134.6h1l.3 3h-1.6z" fill="#231405"/>
<!-- the gap where the slab meets its frame -->
<rect x=".5" y=".5" width="103" height="223" fill="none" stroke="#2e1808" stroke-opacity=".5"/>
</svg>
