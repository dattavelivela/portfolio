<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 110">
  <!-- the front of an airmail envelope: stamp, postmark, the striped border -->
  <defs>
    <pattern id="air" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#f8f3e6"/><rect width="4.5" height="14" fill="#d8443b"/><rect x="7" width="4.5" height="14" fill="#2f5bb5"/>
    </pattern>
    <filter id="fibre" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="5"/>
      <feColorMatrix values="0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .25  .6 0 0 0 -.28"/>
    </filter>
  </defs>
  <rect width="170" height="110" fill="url(#air)"/>
  <rect x="5" y="5" width="160" height="100" fill="#f8f3e6"/>
  <rect width="170" height="110" filter="url(#fibre)"/>
  <!-- PAR AVION -->
  <g transform="translate(14 16)">
    <rect width="38" height="10" rx="1" fill="#2f5bb5"/>
    <text x="19" y="7" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="5" font-weight="700" letter-spacing=".4" fill="#fff">PAR AVION</text>
  </g>
  <!-- stamp: perforated, a door in a sunrise -->
  <g transform="translate(124 12) rotate(2 17 20)">
    <rect x=".6" y="1" width="32" height="38" fill="#3a2d10" fill-opacity=".14"/>
    <rect width="32" height="38" fill="#fffdf6"/>
    <g fill="#f8f3e6"><circle cx="0" cy="2" r="1.1"/><circle cx="0" cy="6" r="1.1"/><circle cx="0" cy="10" r="1.1"/><circle cx="0" cy="14" r="1.1"/><circle cx="0" cy="18" r="1.1"/><circle cx="0" cy="22" r="1.1"/><circle cx="0" cy="26" r="1.1"/><circle cx="0" cy="30" r="1.1"/><circle cx="0" cy="34" r="1.1"/><circle cx="32" cy="2" r="1.1"/><circle cx="32" cy="6" r="1.1"/><circle cx="32" cy="10" r="1.1"/><circle cx="32" cy="14" r="1.1"/><circle cx="32" cy="18" r="1.1"/><circle cx="32" cy="22" r="1.1"/><circle cx="32" cy="26" r="1.1"/><circle cx="32" cy="30" r="1.1"/><circle cx="32" cy="34" r="1.1"/><circle cx="2" cy="0" r="1.1"/><circle cx="6" cy="0" r="1.1"/><circle cx="10" cy="0" r="1.1"/><circle cx="14" cy="0" r="1.1"/><circle cx="18" cy="0" r="1.1"/><circle cx="22" cy="0" r="1.1"/><circle cx="26" cy="0" r="1.1"/><circle cx="30" cy="0" r="1.1"/><circle cx="2" cy="38" r="1.1"/><circle cx="6" cy="38" r="1.1"/><circle cx="10" cy="38" r="1.1"/><circle cx="14" cy="38" r="1.1"/><circle cx="18" cy="38" r="1.1"/><circle cx="22" cy="38" r="1.1"/><circle cx="26" cy="38" r="1.1"/><circle cx="30" cy="38" r="1.1"/></g>
    <rect x="3" y="3" width="26" height="25" fill="#f4a24c"/>
    <circle cx="16" cy="24" r="9" fill="#ffd27a"/>
    <path d="M3 28V21q6-4 13-1t13-2v10z" fill="#3c8f6a"/>
    <rect x="12.5" y="13" width="7" height="12" rx=".6" fill="#7a4829"/>
    <circle cx="18" cy="19.4" r=".7" fill="#ffd27a"/>
    <text x="16" y="34.6" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="4.2" font-weight="700" letter-spacing=".5" fill="#2f3557">INDIA ₹5</text>
  </g>
  <!-- postmark, over the stamp's corner -->
  <g fill="none" stroke="#2c3264" stroke-opacity=".55" stroke-width=".8">
    <circle cx="120" cy="36" r="12"/><circle cx="120" cy="36" r="8.6"/>
    <path d="M58 30q5-3 10 0t10 0 10 0 10 0M58 36q5-3 10 0t10 0 10 0 10 0M58 42q5-3 10 0t10 0 10 0 10 0"/>
  </g>
  <text x="120" y="38" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="4.4" font-weight="700" fill="#2c3264" fill-opacity=".6">OCT</text>
  <!-- address lines, under the handwritten name -->
  <g fill="#2f3557" fill-opacity=".28"><rect x="46" y="80" width="70" height="1.2"/><rect x="46" y="92" width="52" height="1.2"/></g>
</svg>
