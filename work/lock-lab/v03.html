<!-- v03 idea: Datta's front door, number 132, on a HELLO mat; each typed box is a knock, wrong snaps the letterbox flap shut, right swings the door open on a cannon-es hinge and warm light spills onto the mat. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>v03 · Door 132</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..600&family=Space+Mono&family=Caveat:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<script type="importmap">{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "cannon-es":"https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"}}</script>
<style>
#art canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#art .cap{position:absolute;left:0;right:0;bottom:9%;margin:0;text-align:center;font:500 36px/1 var(--hand);color:var(--ink);opacity:0;transform:translateY(6px) rotate(-2deg);transition:opacity .45s,transform .45s;pointer-events:none}
#art .cap.in{opacity:.82;transform:none}
#art .cap.bad{color:var(--red)}
/* static fallback when WebGL or the CDN is unavailable */
#art .fb{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%)}
#art .fb b{display:block;margin-top:18px;text-align:center;font:500 30px/1 var(--hand);color:var(--ink);opacity:.8}
#art.gl .fb{display:none}

</style>
</head>
<body>
<main id="lk"></main>
<div id="art" aria-hidden="true"><div class="fb"><img src="../../assets/shelf/door.svg" alt="" style="display:block;width:150px;margin:0 auto"><img src="../../assets/shelf/mat.svg" alt="" style="display:block;width:170px;margin:-4px auto 0"><b>hi, it's me</b></div><p class="cap"></p></div>
<script src="base.js"></script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as CANNON from 'cannon-es';
const art=document.getElementById('art'), capEl=art.querySelector('.cap');
let capT=0;
function say(t,bad,ms){ clearTimeout(capT); capEl.classList.remove('in'); setTimeout(()=>{ capEl.textContent=t; capEl.classList.toggle('bad',!!bad); capEl.classList.add('in'); },180);
  if(ms) capT=setTimeout(()=>say(IDLE),ms); }
const IDLE="hi, it's me";
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function grain(x,w,h,amt){ const d=x.getImageData(0,0,w,h),a=d.data; for(let i=0;i<a.length;i+=4){ const n=(Math.random()-.5)*amt; a[i]+=n;a[i+1]+=n;a[i+2]+=n; } x.putImageData(d,0,0); }
function canvasTex(w,h,draw){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t; }
function svgTex(url,w,h){ const t=canvasTex(w,h,()=>{}); const im=new Image(); im.onload=()=>{ t.image.getContext('2d').drawImage(im,0,0,w,h); t.needsUpdate=true; }; im.src=url; return t; }

/* ---------- a light studio: transparent renderer over the page bg, soft shadows, resize, pause when hidden ---------- */
let renderer=null;
try{ renderer=new THREE.WebGLRenderer({antialias:true,alpha:true}); }catch(e){}
function stage({eye,look,fov=30,shadow=3,sunPos=[-2.5,6,4.5],shadowOpacity=.14}){
  art.classList.add('gl'); art.prepend(renderer.domElement);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setClearColor(0xf8f8f8,0);
  renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFShadowMap;
  const scene=new THREE.Scene();
  const pm=new THREE.PMREMGenerator(renderer); scene.environment=pm.fromScene(new RoomEnvironment(),.04).texture;
  const sun=new THREE.DirectionalLight(0xffffff,1.5); sun.position.set(...sunPos); sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048); sun.shadow.radius=7; sun.shadow.blurSamples=20; sun.shadow.bias=-.0005; sun.shadow.normalBias=.02;
  Object.assign(sun.shadow.camera,{left:-shadow,right:shadow,top:shadow,bottom:-shadow,near:.5,far:25}); scene.add(sun);
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.ShadowMaterial({opacity:shadowOpacity})); floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
  const view=new THREE.PerspectiveCamera(fov,1,.05,80);
  const S={scene,view,sun,floor,eye:new THREE.Vector3(...eye),look:new THREE.Vector3(...look),frames:[],mouse:{x:0,y:0},clock:0,camEase:1.2,parallax:[.5,.3]};
  S.eyeTo=S.eye.clone(); S.lookTo=S.look.clone();
  addEventListener('pointermove',e=>{ S.mouse.x=e.clientX/innerWidth-.5; S.mouse.y=e.clientY/innerHeight-.5; });
  S.ndc=(e)=>{ const r=renderer.domElement.getBoundingClientRect(); return new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1); };
  function size(){ const r=art.getBoundingClientRect(); renderer.setSize(r.width,r.height,false); view.aspect=r.width/Math.max(1,r.height); view.fov=view.aspect<.9?fov:fov*.82; view.updateProjectionMatrix(); }
  new ResizeObserver(size).observe(art); size();
  let last=performance.now(),raf=0;
  function frame(now){ raf=requestAnimationFrame(frame); const dt=Math.min(.033,(now-last)/1000); last=now; S.clock+=dt;
    for(const f of S.frames) f(dt,S.clock);
    S.eye.lerp(S.eyeTo,Math.min(1,dt*S.camEase)); S.look.lerp(S.lookTo,Math.min(1,dt*S.camEase*1.3));
    view.position.set(S.eye.x+S.mouse.x*S.parallax[0],S.eye.y-S.mouse.y*S.parallax[1],S.eye.z); view.lookAt(S.look);
    renderer.render(scene,view); }
  function go(){ if(!raf&&!document.hidden){ last=performance.now(); raf=requestAnimationFrame(frame); } }
  document.addEventListener('visibilitychange',()=>{ if(document.hidden){ cancelAnimationFrame(raf); raf=0; } else go(); });
  go(); say(IDLE); return S;
}
if(renderer) start();
const SOUND=false;   // knuckle sound, off by default
let ac=null;
function knockSound(){ if(!SOUND) return; try{ ac=ac||new AudioContext(); const t=ac.currentTime, o=ac.createOscillator(), g=ac.createGain(), f=ac.createBiquadFilter();
  o.type='triangle'; o.frequency.setValueAtTime(190,t); o.frequency.exponentialRampToValueAtTime(70,t+.08); f.type='lowpass'; f.frequency.value=900;
  g.gain.setValueAtTime(.5,t); g.gain.exponentialRampToValueAtTime(.001,t+.12); o.connect(f).connect(g).connect(ac.destination); o.start(t); o.stop(t+.13); }catch(e){} }

function start(){
  const S=stage({eye:[1.1,1.45,6.6],look:[0,.9,0],fov:30,shadow:3,sunPos:[-3,5,6],shadowOpacity:.12});
  const {scene}=S;
  const DW=1.04, DH=2.24, DT=.06;
  const mesh=(g,m,p,parent=scene)=>{ const o=new THREE.Mesh(g,m); o.position.set(...p); o.castShadow=o.receiveShadow=true; parent.add(o); return o; };

  /* ---------- an invisible wall: masks the room behind, catches shadows, lets the page show through ---------- */
  const mask=new THREE.MeshBasicMaterial({colorWrite:false}), wallShade=new THREE.ShadowMaterial({opacity:.07});
  const OW=DW+.02, OH=DH+.01;
  for(const [w,h,x,y] of [[8,8,-(OW/2+4),4],[8,8,OW/2+4,4],[OW,8-OH,0,OH+(8-OH)/2]]){
    const g=new THREE.PlaneGeometry(w,h); const m=new THREE.Mesh(g,mask); m.position.set(x,y,-.04); m.renderOrder=-1; scene.add(m);
    const sh=new THREE.Mesh(g,wallShade); sh.position.set(x,y,-.038); sh.receiveShadow=true; scene.add(sh); }
  // painted casing around the opening
  const trim=new THREE.MeshStandardMaterial({color:0xf3f1ec,roughness:.7});
  mesh(new THREE.BoxGeometry(.1,OH+.1,.08),trim,[-OW/2-.05,(OH+.1)/2,0]); mesh(new THREE.BoxGeometry(.1,OH+.1,.08),trim,[OW/2+.05,(OH+.1)/2,0]);
  mesh(new THREE.BoxGeometry(OW+.2,.1,.08),trim,[0,OH+.05,0]);
  mesh(new THREE.BoxGeometry(OW+.2,.03,.16),trim,[0,.015,.02]);   // threshold

  /* ---------- the room behind: warm, lit from inside ---------- */
  const roomTex=canvasTex(64,256,(x,w,h)=>{ const g=x.createLinearGradient(0,0,0,h); g.addColorStop(0,'#ffe9c4'); g.addColorStop(1,'#ffc27a'); x.fillStyle=g; x.fillRect(0,0,w,h); });
  // +x, -x, ceiling, floor, front, back wall: a little shading so the room reads as a space
  const roomBase=[0xffcf92,0xffd49c,0xffe6c2,0xf0a75c,0xffffff,0xffffff];
  const roomMats=roomBase.map((c,i)=>new THREE.MeshBasicMaterial({map:i===5?roomTex:null,side:THREE.BackSide,color:0x000000}));
  const room=new THREE.Mesh(new THREE.BoxGeometry(3,2.6,3),roomMats); room.position.set(0,1.3,-1.56); scene.add(room);
  const inner=new THREE.PointLight(0xffc98a,0,8,1.2); inner.position.set(0,1.6,-.9); scene.add(inner);
  const spill=new THREE.SpotLight(0xffc27a,0,9,.62,.7,1); spill.position.set(0,2.2,-1.2); spill.target.position.set(0,0,1.4); scene.add(spill,spill.target);
  // the light pool on the floor (the floor is only a shadow catcher, so draw the pool)
  const poolTex=canvasTex(256,256,(x,w,h)=>{ const g=x.createLinearGradient(0,0,0,h); g.addColorStop(0,'rgba(255,196,120,.95)'); g.addColorStop(1,'rgba(255,196,120,0)');
    x.fillStyle=g; x.beginPath(); x.moveTo(w*.3,0); x.lineTo(w*.7,0); x.lineTo(w,h); x.lineTo(0,h); x.closePath(); x.filter='blur(6px)'; x.fill(); });
  const pool=new THREE.Mesh(new THREE.PlaneGeometry(2.1,2),new THREE.MeshBasicMaterial({map:poolTex,transparent:true,opacity:0,depthWrite:false,blending:THREE.NormalBlending}));
  pool.rotation.x=-Math.PI/2; pool.position.set(.1,.004,1.05); scene.add(pool);

  /* ---------- HELLO mat ---------- */
  const matTex=svgTex('../../assets/shelf/mat.svg',980,400);
  const coir=new THREE.MeshStandardMaterial({color:0xa8763f,roughness:1});
  mesh(new RoundedBoxGeometry(1.2,.03,.49,2,.012),[coir,coir,new THREE.MeshStandardMaterial({map:matTex,roughness:1}),coir,coir,coir],[0,.016,.5]);

  /* ---------- the door, hinged on the left ---------- */
  const doorTex=svgTex('../../assets/shelf/door.svg',624,1344);
  const wood=new THREE.MeshStandardMaterial({color:0x8a552f,roughness:.7});
  const door=new THREE.Group(); scene.add(door);
  const slab=mesh(new THREE.BoxGeometry(DW,DH,DT),[wood,wood,wood,wood,new THREE.MeshStandardMaterial({map:doorTex,roughness:.62}),wood],[DW/2,0,0],door);
  const brass=new THREE.MeshPhysicalMaterial({color:0xe2b24f,metalness:1,roughness:.28});
  const at=(sx,sy)=>[sx/100,DH/2-sy/100];          // door.svg coords -> door-local, hinge edge at x=0
  const [kx,ky]=at(95,123);
  mesh(new THREE.CylinderGeometry(.018,.022,.07,16),brass,[kx,ky,DT/2+.035],door).rotation.x=Math.PI/2;
  mesh(new THREE.SphereGeometry(.052,24,16),brass,[kx,ky,DT/2+.085],door);
  // letterbox flap, hinged along its top edge
  const [fx,fy]=at(52,108);
  const flapPivot=new THREE.Group(); flapPivot.position.set(fx,fy,DT/2+.012); door.add(flapPivot);
  mesh(new RoundedBoxGeometry(.3,.085,.012,2,.004),brass,[0,-.0425,0],flapPivot);
  const glowMat=new THREE.MeshBasicMaterial({color:0xffc27a,transparent:true,opacity:0});
  const glow=new THREE.Mesh(new THREE.PlaneGeometry(.27,.046),glowMat); const [gx,gy]=at(52,115.3); glow.position.set(gx,gy,DT/2+.002); door.add(glow);
  door.position.set(-DW/2,DH/2,0);

  /* ---------- physics: hinge constraint, door stop, closer damping ---------- */
  const world=new CANNON.World({gravity:new CANNON.Vec3(0,-9.8,0)});
  const frameBody=new CANNON.Body({mass:0}); world.addBody(frameBody);
  const doorBody=new CANNON.Body({mass:4,shape:new CANNON.Box(new CANNON.Vec3(DW/2,DH/2,DT/2)),angularDamping:.55});
  doorBody.position.set(0,DH/2,0); world.addBody(doorBody);
  world.addConstraint(new CANNON.HingeConstraint(frameBody,doorBody,{pivotA:new CANNON.Vec3(-DW/2,DH/2,0),axisA:new CANNON.Vec3(0,1,0),pivotB:new CANNON.Vec3(-DW/2,0,0),axisB:new CANNON.Vec3(0,1,0)}));
  const MAXA=1.7;

  /* ---------- events ---------- */
  let phase='closed', shake={x:0,v:0}, flap={a:0,v:0,T:0}, t0=0, said=false, knocks=[];
  lk.on('type',n=>{ if(phase!=='closed') return; if(n>0){ shake.v+=1.3; knockSound(); } flap.T=n/6*.75; });
  lk.on('wrong',()=>{ if(phase!=='closed') return; flap.T=0; flap.v=-16; snap=.25; say('close, try again',true,2200); });
  lk.on('right',()=>{ if(phase!=='closed') return; phase='open'; t0=S.clock;
    setTimeout(()=>{ doorBody.applyImpulse(new CANNON.Vec3(0,0,-4.6),new CANNON.Vec3(DW/2-.1,DH/2,0)); },350); flap.T=.2; });
  let snap=0;

  S.frames.push((dt,t)=>{
    // knocks rattle the slab on a damped spring
    shake.v+=(-420*shake.x-16*shake.v)*dt; shake.x+=shake.v*dt;
    // flap: stiff spring; a snapped flap hits the stop and bounces
    flap.v+=(-160*(flap.a-flap.T)-11*flap.v)*dt; flap.a+=flap.v*dt; if(flap.a<0){ flap.a=0; flap.v=-flap.v*.35; }
    flapPivot.rotation.x=-flap.a;
    if(snap>0){ snap-=dt; door.position.z=Math.sin(t*90)*.006*snap*4; } else door.position.z=0;
    glowMat.opacity=Math.min(1,flap.a*1.4);
    if(phase==='closed'){
      door.rotation.y=shake.x*.02; door.position.x=-DW/2+shake.x*.004;
    } else {
      world.step(1/120,dt,6);
      // door stop: past ~100 degrees it bounces back softly
      const ang=2*Math.atan2(doorBody.quaternion.y,doorBody.quaternion.w);
      if(ang>MAXA&&doorBody.angularVelocity.y>0){ doorBody.angularVelocity.y*=-.3; }
      door.rotation.y=ang; door.position.x=-DW/2;
      const k=clamp(ang/1.3,0,1);
      roomMats.forEach((m,i)=>m.color.set(roomBase[i]).multiplyScalar(k)); inner.intensity=k*5; spill.intensity=k*16; pool.material.opacity=k*.42;
      if(k>.4&&!said){ said=true; say('come in'); S.eyeTo.set(.6,1.6,6.9); S.lookTo.set(-.1,.85,.2); }
    }
  });
}

</script>
</body>
</html>
