<!-- v17 idea: a chat thread with Datta; he replies to every box you type ("hey", "who's this?"...), his Bengaluru time ticks in the header, and the right password gets "come in 👋". -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>v17 · Datta is typing…</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..600&family=Space+Mono&family=Caveat:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
#art{display:flex;align-items:center;justify-content:center}
.chat{position:relative;width:380px;height:600px;max-height:calc(100% - 80px);display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:28px;overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 24px 60px -30px rgba(0,0,0,.18)}
.hd{display:flex;align-items:center;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--line);background:#fcfcfc}
.av{position:relative;width:40px;height:40px;border-radius:50%;background:#ddd center/cover;flex:none}
.av::after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:#2fb36b;border:2px solid #fcfcfc}
.hd b{display:block;font:600 16px/1.2 var(--sans);color:var(--ink)}
.hd small{display:block;font:400 13px/1.3 var(--sans);color:var(--muted)}
.hd small i{font-style:normal;font-variant-numeric:tabular-nums}
.th{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:16px 16px 10px;overflow:hidden}
.day{align-self:center;margin:0 0 8px;font:400 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.m{position:relative;max-width:76%;padding:9px 14px;border-radius:19px;font:400 15.5px/1.35 var(--sans);transform-origin:0 100%;
  animation:pop .42s linear(0,.5 14%,1.08 34%,.97 56%,1.01 76%,1) both}
.m.d{align-self:flex-start;background:#f0f0f1;color:var(--ink);border-bottom-left-radius:6px}
.m.v{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px;transform-origin:100% 100%;letter-spacing:.18em}
.m.out{animation:gone .22s ease-in both}
.m .re{position:absolute;left:-14px;top:-14px;width:30px;height:30px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:16px;
  box-shadow:0 2px 6px rgba(0,0,0,.08);animation:pop .5s .1s linear(0,.5 14%,1.2 34%,.95 56%,1.02 76%,1) both}
.typing{align-self:flex-start;display:flex;gap:4px;padding:13px 14px;background:#f0f0f1;border-radius:19px;border-bottom-left-radius:6px;transform-origin:0 100%;transition:transform .3s linear(0,.6 18%,1.08 40%,.98 62%,1),opacity .2s}
.typing.hide{transform:scale(.4);opacity:0;position:absolute}
.typing i{width:7px;height:7px;border-radius:50%;background:#9fa0a3;animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.status{height:16px;padding:0 20px;font:400 12px/16px var(--sans);color:var(--faint)}
.chip{align-self:flex-start;margin:2px 0 0;padding:7px 13px;border:1px solid var(--blue);border-radius:999px;color:var(--blue);font:500 14px/1.2 var(--sans);text-decoration:none;
  animation:pop .45s .15s linear(0,.5 14%,1.08 34%,.97 56%,1.01 76%,1) both}
.chip:hover{background:rgba(50,121,242,.08)}
.cmp{display:flex;align-items:center;gap:10px;padding:10px 12px 14px;border-top:1px solid var(--line)}
.cmp .f{flex:1;height:36px;border:1px solid var(--line);border-radius:18px;padding:0 14px;display:flex;align-items:center;font:400 15px/1 var(--sans);color:var(--faint);overflow:hidden}
.cmp .f.has{color:var(--ink);letter-spacing:.2em}
.cmp .s{width:32px;height:32px;border-radius:50%;background:var(--line);display:grid;place-items:center;transition:background .2s}
.cmp .s.on{background:var(--blue)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
@keyframes gone{to{transform:scale(.6);opacity:0}}
@keyframes blink{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-3px);opacity:1}}
html.demo *{animation-duration:0s!important;animation-delay:0s!important;transition:none!important}
@media (prefers-reduced-motion:reduce){.m,.chip,.m .re,.typing{animation:none!important;transition:none!important}.typing i{animation:none}}
</style>
</head>
<body>
<main id="lk"></main>
<div id="art" aria-hidden="true">
  <div class="chat">
    <div class="hd"><div class="av" id="av"></div><div><b>Datta</b><small>Bengaluru · <i id="clock">--:--</i></small></div></div>
    <div class="th" id="th">
      <div class="day">today</div>
      <div class="m d">hi, it's me 👋</div>
      <div class="m d">this one's under NDA</div>
      <div class="typing hide" id="typing"><i></i><i></i><i></i></div>
    </div>
    <div class="status" id="status"></div>
    <div class="cmp"><div class="f" id="f">password</div><div class="s" id="s"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 12V2M3 6l4-4 4 4"/></svg></div></div>
  </div>
</div>
<script src="base.js"></script>
<script type="module">
const PHOTO='../../assets/datta.jpg';
const MAIL='mailto:withgurudatta@gmail.com?subject=Password%20for%20the%20case%20study';
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=id=>document.getElementById(id);
const th=$('th'), typing=$('typing'), status=$('status'), f=$('f'), send=$('s');
$('av').style.backgroundImage=`url(${PHOTO})`;

// his local time, live
const fmt=new Intl.DateTimeFormat('en-IN',{timeZone:'Asia/Kolkata',hour:'numeric',minute:'2-digit',hour12:true});
const clock=()=>{$('clock').textContent=fmt.format(new Date()).toUpperCase()+' his time'};clock();setInterval(clock,10000);

const REPLIES=['hey','who\'s this?','ah, the case study','you have the password?','almost'];
const DELAY=RM?0:520;
let shown=[], pending=null, busy=false, done=false;
function add(cls,html){const m=document.createElement('div');m.className='m '+cls;m.innerHTML=html;th.insertBefore(m,typing);trim();return m}
function trim(){const ms=[...th.querySelectorAll('.m,.chip')];while(ms.length>9)ms.shift().remove()}
function showTyping(on){typing.classList.toggle('hide',!on);status.textContent=on?'Datta is typing…':'';if(on)th.appendChild(typing)}
function reply(text,after){clearTimeout(pending);showTyping(true);
  pending=setTimeout(()=>{showTyping(false);const m=add('d',text);after&&after(m)},DELAY)}
function draft(n){f.textContent=n?'•'.repeat(n):'password';f.classList.toggle('has',!!n);send.classList.toggle('on',n===6)}

let attempt=[];           // replies added during this attempt (removed again on backspace)
lk.on('type',n=>{if(done)return;draft(n);
  if(n===0){clearTimeout(pending);showTyping(false);attempt=[];return}
  if(attempt.length>=n){clearTimeout(pending);showTyping(false)}
  while(attempt.length>n){const m=attempt.pop();m.classList.add('out');setTimeout(()=>m.remove(),RM?0:220)}
  if(n<=5&&attempt.length<n){const i=n-1;reply(REPLIES[i],m=>{attempt.push(m)})}
  else if(n<=5){showTyping(true);clearTimeout(pending);pending=setTimeout(()=>showTyping(false),900)}});
lk.on('wrong',()=>{clearTimeout(pending);add('v','••••••');attempt=[];
  reply('nope, that\'s not it 😅',()=>{setTimeout(()=>{const c=document.createElement('a');c.className='chip';c.href=MAIL;c.textContent='want me to email it?';th.insertBefore(c,typing);trim()},RM?0:260)})});
lk.on('right',()=>{done=true;clearTimeout(pending);draft(0);const mine=add('v','••••••');
  reply('come in 👋',()=>{const r=document.createElement('span');r.className='re';r.textContent='🚪';mine.appendChild(r);status.textContent='Read just now'})});

// ?demo=N | right | wrong : fire the handlers as if typed (for screenshots)
const q=new URLSearchParams(location.search).get('demo');
if(q)document.documentElement.classList.add('demo');
if(q)setTimeout(async()=>{const bx=[...document.querySelectorAll('#lk .bx')], wait=ms=>new Promise(r=>setTimeout(r,ms));
  if(q==='wrong'){for(let i=0;i<5;i++){bx[i].value='12345'[i];lk.count=i+1;lk.emit('type',i+1);await wait(600)}
    bx[5].value='9';lk.count=6;lk.state='wrong';document.querySelector('#lk .msg').textContent='Not quite. Try again.';lk.emit('type',6);lk.emit('wrong');return}
  const n=q==='right'?6:Math.max(0,Math.min(5,+q||0));
  for(let i=0;i<n;i++){bx[i].value='123456'[i];bx[i].dispatchEvent(new Event('input'));await wait(600)}},300);
</script>
</body>
</html>
