<!-- v16 idea: an instant photo of Datta that develops a little more with every typed box; the right password flashes it into full colour. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>v16 · Develops as you type</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..600&family=Space+Mono&family=Caveat:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
#art{display:flex;align-items:center;justify-content:center;
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:26px}
.pol{position:relative;width:268px;padding:14px 14px 0;background:#fdfdfb;border-radius:3px;
  box-shadow:0 1px 1px rgba(0,0,0,.05),0 10px 24px -8px rgba(0,0,0,.18),0 34px 60px -30px rgba(0,0,0,.22);
  transform:rotate(-3deg);will-change:transform}
.pol::after{content:"";position:absolute;inset:0;border-radius:3px;background:var(--grain);opacity:.18;mix-blend-mode:multiply;pointer-events:none}
.ph{position:relative;width:240px;height:240px;overflow:hidden;background:#cdd5c8}
.ph img{display:block;width:100%;height:100%;object-fit:cover;filter:blur(.35px)}
.ph .milk{position:absolute;inset:0;background:radial-gradient(120% 90% at 40% 35%,#d7ddd1,#c3cbbd 70%,#b9c2b3)}
.ph .grain{position:absolute;inset:0;background:var(--grain);mix-blend-mode:overlay;opacity:.55}
.ph .sheen{position:absolute;inset:0;background:linear-gradient(125deg,rgba(255,255,255,.22),rgba(255,255,255,0) 40%,rgba(255,255,255,0) 70%,rgba(255,255,255,.08));pointer-events:none}
.cap{height:60px;display:flex;align-items:center;justify-content:center;font:500 30px/1 var(--hand);color:#2b2b30;transform:rotate(-1.5deg)}
.cap span{display:inline-block;transition:opacity .22s,transform .32s linear(0,.6 18%,1.08 40%,.98 62%,1)}
.cap span.out{opacity:0;transform:translateY(6px) rotate(2deg)}
.cap.bad{color:var(--red)}
.meta{display:flex;gap:10px;align-items:center;font:400 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.meta i{display:block;width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .3s}
.meta i.on{background:#6f7d6b}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
html.demo *{transition:none!important}
@media (prefers-reduced-motion:reduce){.cap span{transition:none}}
</style>
</head>
<body>
<main id="lk"></main>
<div id="art" aria-hidden="true">
  <div class="stage">
    <div class="pol" id="pol">
      <div class="ph"><img id="img" alt=""><div class="milk" id="milk"></div><div class="grain"></div><div class="sheen"></div></div>
      <div class="cap" id="cap"><span>hi, it's me</span></div>
    </div>
    <div class="meta"><span id="lbl">developing</span><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <div class="flash" id="flash"></div>
</div>
<script src="base.js"></script>
<script type="module">
const PHOTO='../../assets/datta.jpg';
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=id=>document.getElementById(id);
const img=$('img'), milk=$('milk'), pol=$('pol'), cap=$('cap'), flash=$('flash'), dots=[...document.querySelectorAll('.meta i')], lbl=$('lbl');
img.src=PHOTO;

// tiny critically-underdamped spring
function spring(x=0,k=60,d=12){return{x,v:0,t:x,k,d,step(dt){const a=-this.k*(this.x-this.t)-this.d*this.v;this.v+=a*dt;this.x+=this.v*dt;if(RM){this.x=this.t;this.v=0}}}}
const dev=spring(0,26,10);     // 0 = milky blank, 1 = fully developed
const rot=spring(-3,220,14), sc=spring(1,260,16);
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)), ss=(a,b,v)=>{v=cl((v-a)/(b-a));return v*v*(3-2*v)};

function paint(){
  const p=cl(dev.x,0,1.05);
  const tone=ss(0,.7,p), colour=ss(.45,1,p);           // shadows first, then colour
  milk.style.opacity=(1-ss(0,.7,p)*.97).toFixed(3);
  img.style.filter=`blur(${(.9-.6*p).toFixed(2)}px) brightness(${(1.9-.9*tone).toFixed(3)}) contrast(${(.35+.65*tone).toFixed(3)}) saturate(${(colour).toFixed(3)}) sepia(${(.55*(1-colour)).toFixed(3)}) hue-rotate(${(40*(1-colour)).toFixed(1)}deg)`;
  pol.style.transform=`rotate(${rot.x.toFixed(2)}deg) scale(${sc.x.toFixed(4)})`;
}
let last=performance.now();
let fl=0;
(function tick(now){let e=Math.min(.5,(now-last)/1000);last=now;while(e>0){const dt=Math.min(1/120,e);e-=dt;dev.step(dt);rot.step(dt);sc.step(dt);fl=Math.max(0,fl-dt*1.8)}flash.style.opacity=(fl*fl).toFixed(3);paint();requestAnimationFrame(tick)})(last);

let curText="hi, it's me", swapT;
function say(t,bad){cap.classList.toggle('bad',!!bad);if(t===curText)return;curText=t;const s=cap.firstElementChild;s.classList.add('out');clearTimeout(swapT);
  swapT=setTimeout(()=>{s.textContent=t;void s.offsetWidth;s.classList.remove('out')},RM?0:180)}
function meter(n){dots.forEach((d,i)=>d.classList.toggle('on',i<n))}

let wrongAt=-1e9, done=false;
function idle(n){dev.t=n/6*.86;meter(n);lbl.textContent='developing';
  say(n===0?"hi, it's me":n<4?'developing…':'almost…')}
lk.on('type',n=>{if(done)return;
  if(n===0&&performance.now()-wrongAt<1500){dev.t=0;meter(0);setTimeout(()=>{if(lk.count===0&&!done)idle(0)},1100);return}
  idle(n);sc.v+=.35;});
lk.on('wrong',()=>{wrongAt=performance.now();dev.t=0;rot.v-=40;say('close, try again',true);lbl.textContent='overexposed';});
lk.on('right',()=>{done=true;meter(6);lbl.textContent='developed';
  if(RM){dev.t=dev.x=1}else{dev.t=1;dev.x=Math.max(dev.x,.92);sc.x=1.04;rot.t=0;rot.v+=30;fl=1}
  say('come in');});

// ?demo=N | right | wrong : fire the handlers as if typed (for screenshots)
const q=new URLSearchParams(location.search).get('demo');
if(q)document.documentElement.classList.add('demo');
if(q)setTimeout(()=>{const bx=[...document.querySelectorAll('#lk .bx')];
  if(q==='wrong'){'654321'.split('').forEach((c,i)=>bx[i].value=c);document.querySelector('#lk .msg').textContent='Not quite. Try again.';lk.count=6;lk.state='wrong';lk.emit('type',6);lk.emit('wrong');return}
  const n=q==='right'?6:cl(+q||0,0,5);for(let i=0;i<n;i++)bx[i].value='123456'[i];if(n)bx[n-1].dispatchEvent(new Event('input'));},400);
// headless screenshots barely tick rAF, so settle the springs once the demo state is set
if(q)setTimeout(()=>{[dev,rot,sc].forEach(s=>{s.x=s.t;s.v=0});fl=0;flash.style.opacity=0;paint()},900);
</script>
</body>
</html>
