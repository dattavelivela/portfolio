<!-- v26 idea: an untuned screen of black and white static with "come in" hidden in it; each box tunes the noise down, a wrong password bursts it back to static, the right one locks the signal clean. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>v26 · Signal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..600&family=Space+Mono&family=Caveat:wght@500&family=Newsreader:ital,opsz,wght@1,6..72,300..500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
body{background:#0b0b0b}
#tv{position:fixed;inset:0;width:100vw;height:100vh;display:block;z-index:0;pointer-events:none}
/* a clean card of paper behind the form so it stays readable over the static */
#lk::before{content:"";position:absolute;z-index:-1;top:-56px;bottom:-60px;left:calc(clamp(24px,12vw,240px) - 56px);right:-56px;
  background:#f8f8f8;border-radius:18px;box-shadow:0 0 0 1px rgba(255,255,255,.06),0 30px 80px -20px rgba(0,0,0,.7)}
#art{z-index:1;color:#e9e9e6}
.mono{position:absolute;font:400 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:5px 7px;background:#0b0b0b}
.tr{right:34px;top:34px}.bl{left:34px;bottom:34px}.br{right:34px;bottom:34px}
.rec{display:inline-block;width:7px;height:7px;border-radius:50%;background:#e9e9e6;margin-right:8px;vertical-align:1px;opacity:.35}
.rec.on{opacity:1;background:#ff5a4f}
@media (max-width:760px){#lk::before{left:-16px;right:-16px}}
</style>
</head>
<body>
<canvas id="tv"></canvas>
<main id="lk"></main>
<div id="art" aria-hidden="true">
  <span class="mono tr" id="ch"><i class="rec" id="rec"></i>ch 132 · no signal</span>
  <span class="mono bl" id="bar">signal ▁ ▁ ▁ ▁ ▁ ▁</span>
  <span class="mono br" id="clk">datta velivela · live</span>
</div>
<script src="base.js"></script>
<script type="module">
import { dither, shade, mask, hash, noise, clamp, lerp, sstep, wireDemo } from './dither.js';
const $ = id => document.getElementById(id);

// the hidden message as a mask, rebuilt on resize and once the font arrives
let msg = null;
function buildMsg() {
  const narrow = innerWidth < 760, cx = narrow ? .5 : .73;
  msg = mask((g, w, h) => {
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = `italic 400 ${Math.round(w * (narrow ? .22 : .118))}px "Newsreader", Georgia, serif`;
    g.fillText('come in', w * cx, h * .47);
    g.font = `700 ${Math.round(w * .03)}px "Space Mono", monospace`;
    g.fillText("it’s datta", w * cx, h * .64);
  }, innerWidth / 2, innerHeight / 2);
}
buildMsg();
document.fonts.load('italic 400 160px "Newsreader"').then(buildMsg).catch(() => {});
addEventListener('resize', buildMsg);

let tune, lock, burst;
const scene = shade((x, y, w, h, t) => {
  const v = y / h, frame = Math.floor(t * 24);
  // rows tear sideways, more when untuned or after a wrong password
  const tear = (1 - tune.x) * .6 + burst.x * 1.5;
  const jitter = (hash(y >> 1, frame, 3) - .5) * tear * 4 * (hash(y >> 3, frame >> 2, 5) > .8 ? 3 : 1);
  const xs = Math.round(x + jitter);
  const m = msg.at((xs + .5) / w, (y + .5) / h);
  const roll = Math.exp(-Math.pow(((v - t * .12) % 1 + 1) % 1 - .5, 2) * 60) * .25 * (1 - lock.x);   // a slow rolling bar
  const scan = (y & 1) ? .9 : 1;
  const signal = (.06 + m * .94) * scan + roll * .5;
  const st = hash(x, y, frame);                                                  // the static itself
  const amount = clamp(lerp(.985, .2, tune.x) * (1 - lock.x) + burst.x);
  return lerp(signal, st * (.75 + roll), amount);
});

const d = dither($('tv'), {
  source: scene, palette: ['#0b0b0b', '#5c5c5a', '#f1f1ee'], grain: .1, dotMin: .5, dotMax: .96, noise: 0, resolve: 1, bayer: 4,
  frame(dt, t, api) { api.p.cell = lerp(8, 4.5, tune.x) - lock.x * .5 + burst.x * 4; }
});
tune = d.ease(0, 2.6); lock = d.ease(0, 1.4); burst = d.ease(0, 6);

const bars = n => $('bar').textContent = 'signal ' + Array.from({ length: 6 }, (_, i) => i < n ? '█' : '▁').join(' ');
let wrongAt = -1e9, done = false;
lk.on('type', n => {
  if (done) return;
  if (n === 0 && performance.now() - wrongAt < 1500) { setTimeout(() => { if (!lk.count && !done) { burst.to(0); tune.to(0); bars(0); setCh('ch 132 · no signal'); } }, 900); return; }
  burst.to(0); tune.to(n / 6); bars(n); setCh(n ? 'ch 132 · tuning ' + Math.round(n / 6 * 100) + '%' : 'ch 132 · no signal');
});
function setCh(s) { $('ch').lastChild.textContent = s; }
lk.on('wrong', () => { wrongAt = performance.now(); burst.x = 1; burst.to(1); tune.to(0); bars(0); setCh('ch 132 · lost'); });
lk.on('right', () => { done = true; tune.to(1); lock.to(1); burst.to(0); bars(6); setCh('ch 132 · locked'); $('rec').classList.add('on'); });
wireDemo(() => { buildMsg(); d.settle(); });
</script>
</body>
</html>
