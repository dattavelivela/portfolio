<!-- v04 idea: a little roly-poly Datta with a low centre of mass (cannon-es) that always rights itself; push or flick it with the mouse, each typed box nudges it, wrong knocks it flat and it gets back up, right makes it bow. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>v04 · Stubborn</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..600&family=Space+Mono&family=Caveat:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<script type="importmap">{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "cannon-es":"https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"}}</script>
<style>
#art canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#art .cap{position:absolute;left:0;right:0;bottom:9%;margin:0;text-align:center;font:500 36px/1 var(--hand);color:var(--ink);opacity:0;transform:translateY(6px) rotate(-2deg);transition:opacity .45s,transform .45s;pointer-events:none}
#art .cap.in{opacity:.82;transform:none}
#art .cap.bad{color:var(--red)}
/* static fallback when WebGL or the CDN is unavailable */
#art .fb{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%)}
#art .fb b{display:block;margin-top:18px;text-align:center;font:500 30px/1 var(--hand);color:var(--ink);opacity:.8}
#art.gl .fb{display:none}
#art canvas{cursor:grab}
</style>
</head>
<body>
<main id="lk"></main>
<div id="art" aria-hidden="true"><div class="fb"><div style="width:150px;height:200px;position:relative"><i style="position:absolute;left:35px;top:0;width:80px;height:80px;border-radius:50%;background:#c58a5f;box-shadow:inset 0 14px 0 #1d1b1a"></i><i style="position:absolute;left:5px;top:62px;width:140px;height:138px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;background:#2f4470"></i></div><b>never stays down</b></div><p class="cap"></p></div>
<script src="base.js"></script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as CANNON from 'cannon-es';
const art=document.getElementById('art'), capEl=art.querySelector('.cap');
let capT=0;
function say(t,bad,ms){ clearTimeout(capT); capEl.classList.remove('in'); setTimeout(()=>{ capEl.textContent=t; capEl.classList.toggle('bad',!!bad); capEl.classList.add('in'); },180);
  if(ms) capT=setTimeout(()=>say(IDLE),ms); }
const IDLE="never stays down";
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function grain(x,w,h,amt){ const d=x.getImageData(0,0,w,h),a=d.data; for(let i=0;i<a.length;i+=4){ const n=(Math.random()-.5)*amt; a[i]+=n;a[i+1]+=n;a[i+2]+=n; } x.putImageData(d,0,0); }
function canvasTex(w,h,draw){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t; }
function svgTex(url,w,h){ const t=canvasTex(w,h,()=>{}); const im=new Image(); im.onload=()=>{ t.image.getContext('2d').drawImage(im,0,0,w,h); t.needsUpdate=true; }; im.src=url; return t; }

/* ---------- a light studio: transparent renderer over the page bg, soft shadows, resize, pause when hidden ---------- */
let renderer=null;
try{ renderer=new THREE.WebGLRenderer({antialias:true,alpha:true}); }catch(e){}
function stage({eye,look,fov=30,shadow=3,sunPos=[-2.5,6,4.5],shadowOpacity=.14}){
  art.classList.add('gl'); art.prepend(renderer.domElement);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setClearColor(0xf8f8f8,0);
  renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFShadowMap;
  const scene=new THREE.Scene();
  const pm=new THREE.PMREMGenerator(renderer); scene.environment=pm.fromScene(new RoomEnvironment(),.04).texture;
  const sun=new THREE.DirectionalLight(0xffffff,1.5); sun.position.set(...sunPos); sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048); sun.shadow.radius=7; sun.shadow.blurSamples=20; sun.shadow.bias=-.0005; sun.shadow.normalBias=.02;
  Object.assign(sun.shadow.camera,{left:-shadow,right:shadow,top:shadow,bottom:-shadow,near:.5,far:25}); scene.add(sun);
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.ShadowMaterial({opacity:shadowOpacity})); floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
  const view=new THREE.PerspectiveCamera(fov,1,.05,80);
  const S={scene,view,sun,floor,eye:new THREE.Vector3(...eye),look:new THREE.Vector3(...look),frames:[],mouse:{x:0,y:0},clock:0,camEase:1.2,parallax:[.5,.3]};
  S.eyeTo=S.eye.clone(); S.lookTo=S.look.clone();
  addEventListener('pointermove',e=>{ S.mouse.x=e.clientX/innerWidth-.5; S.mouse.y=e.clientY/innerHeight-.5; });
  S.ndc=(e)=>{ const r=renderer.domElement.getBoundingClientRect(); return new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1); };
  function size(){ const r=art.getBoundingClientRect(); renderer.setSize(r.width,r.height,false); view.aspect=r.width/Math.max(1,r.height); view.fov=view.aspect<.9?fov:fov*.82; view.updateProjectionMatrix(); }
  new ResizeObserver(size).observe(art); size();
  let last=performance.now(),raf=0;
  function frame(now){ raf=requestAnimationFrame(frame); const dt=Math.min(.033,(now-last)/1000); last=now; S.clock+=dt;
    for(const f of S.frames) f(dt,S.clock);
    S.eye.lerp(S.eyeTo,Math.min(1,dt*S.camEase)); S.look.lerp(S.lookTo,Math.min(1,dt*S.camEase*1.3));
    view.position.set(S.eye.x+S.mouse.x*S.parallax[0],S.eye.y-S.mouse.y*S.parallax[1],S.eye.z); view.lookAt(S.look);
    renderer.render(scene,view); }
  function go(){ if(!raf&&!document.hidden){ last=performance.now(); raf=requestAnimationFrame(frame); } }
  document.addEventListener('visibilitychange',()=>{ if(document.hidden){ cancelAnimationFrame(raf); raf=0; } else go(); });
  go(); say(IDLE); return S;
}
if(renderer) start();
function start(){
  const S=stage({eye:[-.05,1.45,6.8],look:[-.05,.78,0],fov:30,shadow:2.5,sunPos:[-2.5,6,4]});
  const {scene,view}=S;
  /* body origin = centre of mass, 0.3 below the centre of the round base: that offset is what makes it stubborn */
  const HOME=-.3, R=.5, C=.3, HR=.31, HY=1.22;
  const fig=new THREE.Group(); scene.add(fig);
  const pts=[]; for(let i=0;i<=24;i++){ const a=-Math.PI/2+i/24*Math.PI/2; pts.push(new THREE.Vector2(Math.cos(a)*R+.0001,C+Math.sin(a)*R)); }
  for(let i=1;i<=14;i++){ const k=i/14, r=R-(R-.2)*Math.pow(k,1.6); pts.push(new THREE.Vector2(r,C+k*.66)); }
  pts.push(new THREE.Vector2(.0001,C+.68));
  const hoodie=new THREE.MeshStandardMaterial({color:0x2f4470,roughness:.75});
  const torso=new THREE.Mesh(new THREE.LatheGeometry(pts,48),hoodie); torso.castShadow=true; fig.add(torso);
  const skin=new THREE.MeshStandardMaterial({color:0xc68a5f,roughness:.6});
  const head=new THREE.Mesh(new THREE.SphereGeometry(HR,40,28),skin); head.position.y=HY; head.castShadow=true; fig.add(head);
  const hair=new THREE.Mesh(new THREE.SphereGeometry(HR*1.04,40,20,0,Math.PI*2,0,Math.PI*.42),new THREE.MeshStandardMaterial({color:0x1d1b1a,roughness:.9}));
  hair.position.y=HY+.015; hair.rotation.x=-.32; fig.add(hair);
  const ink=new THREE.MeshStandardMaterial({color:0x1a1716,roughness:.4});
  for(const s of [-1,1]){ const e=new THREE.Mesh(new THREE.SphereGeometry(.028,14,10),ink); e.position.set(s*.105,HY+.02,HR-.03); fig.add(e); }
  const smile=new THREE.Mesh(new THREE.TorusGeometry(.07,.012,8,24,Math.PI*.8),ink); smile.position.set(0,HY-.07,HR-.025); smile.rotation.z=Math.PI*1.1; fig.add(smile);
  // the orange slosh camera on a strap, his personal touch
  const cam=new THREE.Group(); cam.position.set(.04,C+.2,R-.04); cam.rotation.x=-.18; fig.add(cam);
  const camBody=new THREE.Mesh(new THREE.BoxGeometry(.24,.17,.08),new THREE.MeshStandardMaterial({color:0xf6853f,roughness:.6})); camBody.castShadow=true; cam.add(camBody);
  const lens=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,.04,24),new THREE.MeshStandardMaterial({color:0x26272d,roughness:.4})); lens.rotation.x=Math.PI/2; lens.position.set(-.01,-.01,.05); cam.add(lens);
  const strap=new THREE.Mesh(new THREE.TorusGeometry(.33,.012,6,40,Math.PI*.7),new THREE.MeshStandardMaterial({color:0x1d1b1a,roughness:.8}));
  strap.position.set(0,C+.23,.12); strap.rotation.set(-.35,0,Math.PI*.15+Math.PI*.0); fig.add(strap);

  /* ---------- physics ---------- */
  const world=new CANNON.World({gravity:new CANNON.Vec3(0,-9.8,0)});
  const groundMat=new CANNON.Material(), figMat=new CANNON.Material();
  world.addContactMaterial(new CANNON.ContactMaterial(groundMat,figMat,{friction:.8,restitution:.05}));
  const ground=new CANNON.Body({mass:0,shape:new CANNON.Plane(),material:groundMat}); ground.quaternion.setFromEuler(-Math.PI/2,0,0); world.addBody(ground);
  const body=new CANNON.Body({mass:1,material:figMat,angularDamping:.35,linearDamping:.1});
  body.addShape(new CANNON.Sphere(R),new CANNON.Vec3(0,C,0));
  body.position.set(HOME,R-C,0); world.addBody(body);
  body.inertia.set(.55,.3,.55); body.invInertia.set(1/.55,1/.3,1/.55); body.updateInertiaWorld(true);   // light top, heavy base

  const tmpV=new CANNON.Vec3();
  function nudge(x,z,h=HY){ body.wakeUp(); const p=body.pointToWorldFrame(new CANNON.Vec3(0,h,0),tmpV); body.applyImpulse(new CANNON.Vec3(x,0,z),p.clone()); }

  /* ---------- mouse: flick it on the way past, or click to poke ---------- */
  const ray=new THREE.Raycaster(); let lastP=null;
  const parts=[torso,head,hair,camBody];
  renderer.domElement.addEventListener('pointermove',e=>{ const n=S.ndc(e); const now=performance.now();
    if(lastP){ const dx=(n.x-lastP.x), dy=(n.y-lastP.y), dtm=Math.max(8,now-lastP.t); ray.setFromCamera(n,view); const hit=ray.intersectObjects(parts,false)[0];
      if(hit&&phase!=='bow'){ const sp=Math.hypot(dx,dy)/dtm*1000; if(sp>.4){ const s=Math.min(.9,sp*.3); body.wakeUp();
        body.applyImpulse(new CANNON.Vec3(dx/Math.hypot(dx,dy)*s,0,-dy/Math.hypot(dx,dy)*s*.4),new CANNON.Vec3(hit.point.x,hit.point.y,hit.point.z)); } } }
    lastP={x:n.x,y:n.y,t:now}; });
  renderer.domElement.addEventListener('pointerdown',e=>{ const n=S.ndc(e); ray.setFromCamera(n,view); const hit=ray.intersectObjects(parts,false)[0];
    if(hit&&phase!=='bow'){ const d=ray.ray.direction; body.wakeUp(); body.applyImpulse(new CANNON.Vec3(d.x*.9,0,d.z*.9),new CANNON.Vec3(hit.point.x,hit.point.y,hit.point.z)); } });

  /* ---------- events ---------- */
  let phase='play', pin=0, t0=0, side=1, upSaid=false;
  lk.on('type',n=>{ if(phase!=='play'||n===0) return; side=-side; nudge(side*(.3+n*.04),.05); });
  lk.on('wrong',()=>{ if(phase!=='play') return; phase='down'; t0=S.clock; nudge(.55,.9); say('close, try again',true); upSaid=false; });
  lk.on('right',()=>{ phase='bow'; t0=S.clock; });

  const up=new THREE.Vector3(), q=new THREE.Quaternion(), want=new THREE.Vector3();
  S.frames.push((dt,t)=>{
    q.set(body.quaternion.x,body.quaternion.y,body.quaternion.z,body.quaternion.w); up.set(0,1,0).applyQuaternion(q);
    const tilt=Math.acos(clamp(up.y,-1,1));
    // keep it on its spot and facing the visitor (a soft tether + yaw spring); the self-righting is pure physics
    body.force.x+=-14*(body.position.x-HOME)-3*body.velocity.x; body.force.z+=-14*body.position.z-3*body.velocity.z;
    const fwd=new THREE.Vector3(0,0,1).applyQuaternion(q); const yaw=Math.atan2(fwd.x,fwd.z); body.torque.y+=-1.2*yaw-.4*body.angularVelocity.y;
    if(phase==='down'){
      // stunned on the floor for a beat (held there), then let go: the low centre of mass does the rest
      if(t-t0>.15&&t-t0<1.5){ want.set(.5,.02,.86).normalize(); const ax=new THREE.Vector3().crossVectors(up,want); body.torque.x+=ax.x*45-body.angularVelocity.x*5; body.torque.z+=ax.z*45-body.angularVelocity.z*5; }
      if(t-t0>1.7&&tilt<.3&&!upSaid){ upSaid=true; say('never stays down'); }
      if(t-t0>3){ phase='play'; if(!upSaid){ upSaid=true; say('never stays down'); } }
    }
    if(phase==='bow'){
      const k=t-t0; const bowing=k>.3&&k<1.5;
      want.set(0,1,0); if(bowing) want.set(0,Math.cos(.62),Math.sin(.62));
      const ax=new THREE.Vector3().crossVectors(up,want);
      body.torque.x+=ax.x*(bowing?22:4)-body.angularVelocity.x*3; body.torque.z+=ax.z*(bowing?22:4)-body.angularVelocity.z*3;
      if(k>1.2&&!said){ said=true; say('come in'); }
    }
    world.step(1/120,dt,6);
    fig.position.copy(body.position); fig.quaternion.copy(body.quaternion);
  });
  let said=false;
}

</script>
</body>
</html>
