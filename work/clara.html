<!DOCTYPE html>
<html lang="en" class="locked">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Protected &mdash; Gurudatta Velivela</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="A protected case study. It needs a password.">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="../assets/favicon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="case.css">
</head>
<body>

<!-- the lock. the case study lives in a private Supabase bucket; the unlock
     function checks the password and sends the page back with signed links -->
<div class="gate">
  <div class="gate-card">
    <svg class="gate-key" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="4" y="10.5" width="16" height="10.5" rx="2.5"></rect>
      <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"></path>
      <circle cx="12" cy="15.75" r="1.1" fill="currentColor" stroke="none"></circle>
    </svg>
    <h1>Clara</h1>
    <p>A case study on Procol&rsquo;s AI agent for buying, which I designed from 0 to 1. It covers customer work and commercial figures, so it is not public. If you are hiring and I sent you here, you have the password.</p>
    <form autocomplete="off">
      <input id="pw" type="password" name="pw" placeholder="password" aria-label="Password"
             autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button type="submit">Unlock</button>
    </form>
    <p class="gate-msg" role="status" aria-live="polite"></p>
    <a class="gate-back" href="../index.html">&larr; back to the portfolio</a>
  </div>
</div>

<script>
(function(){
  var ENDPOINT='https://auiuyzhptbtxcpqvlnsw.supabase.co/functions/v1/unlock',
      CASE='clara', KEEP='unlocked:'+CASE,
      gate=document.querySelector('.gate'),
      form=gate.querySelector('form'),
      input=gate.querySelector('input'),
      msg=gate.querySelector('.gate-msg');

  function say(text,bad){ msg.textContent=text; msg.classList.toggle('bad',!!bad); }

  function unlock(pw){
    return fetch(ENDPOINT,{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({case:CASE,password:pw})})
      .then(function(r){
        if(r.status===401) throw new Error('password');
        if(!r.ok) throw new Error('server');
        return r.json();
      });
  }

  /* the case study is a whole page, so it replaces this one */
  function reveal(html){
    var hash=location.hash;
    document.open(); document.write(html); document.close();
    if(hash) setTimeout(function(){ var t=document.getElementById(hash.slice(1)); if(t) t.scrollIntoView(); },300);
  }

  var kept=null;
  try{ kept=sessionStorage.getItem(KEEP); }catch(e){}
  if(kept){
    say('Unlocking…');
    unlock(kept).then(function(j){ reveal(j.html); }).catch(function(){
      try{ sessionStorage.removeItem(KEEP); }catch(e){}
      say('');
    });
  }

  form.addEventListener('submit',function(e){
    e.preventDefault();
    var pw=input.value.trim();
    if(!pw){ input.focus(); return; }
    say('Unlocking…');
    unlock(pw).then(function(j){
      try{ sessionStorage.setItem(KEEP,pw); }catch(e){}
      reveal(j.html);
    }).catch(function(err){
      if(err.message==='password'){
        say('That password is not right.',true);
        gate.classList.add('shake');
        setTimeout(function(){ gate.classList.remove('shake'); },450);
        input.select();
      } else say('This page could not load. Try again in a moment.',true);
    });
  });

  input.focus();
})();
</script>
</body>
</html>
