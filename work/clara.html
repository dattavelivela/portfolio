<style>
/* a quiet spinner while the case study loads; the lock page only shows without a password */
html,body{margin:0;height:100%;background:#f8f8f8;overflow-x:hidden}
.wait{position:fixed;top:50%;left:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:2px solid rgba(60,56,48,.15);border-top-color:rgba(60,56,48,.55);animation:r .8s linear infinite}
.locked .wait{display:none}
@keyframes r{to{transform:rotate(360deg)}}

#lock{position:fixed;inset:0;display:grid;grid-template-columns:1fr;justify-items:center;align-items:start;padding-top:clamp(56px,12vh,120px);box-sizing:border-box;overflow:hidden;
  background:#f8f8f8;
  color:#444447;font:400 17px/1.5 "Geist",-apple-system,system-ui,sans-serif}
#lock[hidden]{display:none}
.lk-box{padding:0 24px;max-width:460px;text-align:center;opacity:0;transform:translateY(6px);animation:in .6s .1s ease forwards}
.lk-back{display:inline-block;margin:0 0 18px;color:#6b6c6e;text-decoration:none;font-size:15px}
.lk-back:hover{color:#0a0a0a}
.lk-box p{margin:0 0 8px;font-size:17px;line-height:1.55}
.lk-box form{display:flex;gap:8px;align-items:center;justify-content:center}
.lk-box .bx{width:38px;height:44px;padding:0;border:1px solid #e4e4e4;border-radius:8px;background:#fff;color:#0a0a0a;text-align:center;box-sizing:border-box;
  font:400 19px/1 "Geist",-apple-system,system-ui,sans-serif;text-transform:none;outline:none;caret-color:#3279f2;transition:border-color .2s,box-shadow .2s}
.lk-box .bx:focus{border-color:#3279f2;box-shadow:0 0 0 3px rgba(50,121,242,.15)}
.lk-box .dash{width:16px;text-align:center;color:#a1a1a4;font-size:18px}
.lk-box .spin{display:none;margin-left:8px;width:15px;height:15px;border-radius:50%;border:2px solid #3279f2;border-right-color:transparent;animation:r .7s linear infinite}
.lk-box form.busy .spin{display:none}
.lk-box form.busy .bx{opacity:.6}
.lk-box form.bad{animation:shake .4s cubic-bezier(.36,.07,.19,.97)}
.lk-box form.bad .bx{border-color:#ef4b54;caret-color:#ef4b54}
.lk-box form.bad .bx:focus{border-color:#ef4b54;box-shadow:0 0 0 3px rgba(239,75,84,.18)}
.lk-msg{position:absolute;left:0;right:0;text-align:center;margin:8px 0 0!important;font-size:14px!important;color:#ef4b54}
.lk-box{position:relative}
.lk-help{margin:0 0 28px!important;font:400 13px/1.4 "Geist Mono",ui-monospace,monospace!important;letter-spacing:.06em;text-transform:uppercase;color:#6b6c6e}
.lk-help{overflow-wrap:anywhere}
.lk-help a{color:#0a0a0a;text-underline-offset:4px}
/* desk background: the objects frame the page edges, lit like a desk by a window (top right) */
#lock{background:radial-gradient(120% 90% at 78% 0%,#fff 0%,#f8f8f8 45%,#f1f1f1 100%)}
#lock::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:linear-gradient(118deg,transparent 58%,rgba(40,36,30,.035) 64%,transparent 70%,transparent 74%,rgba(40,36,30,.03) 80%,transparent 86%)}
.lk-box{z-index:2}
.lk-art{display:block;position:absolute;inset:0;pointer-events:none;z-index:0;opacity:0;transition:opacity 1s .1s}
.lk-art.ready{opacity:1}
.lk-art canvas{display:block;pointer-events:auto;touch-action:none}
@media (max-width:760px){.lk-art{display:block}}
.rd{transform:scaleX(0);animation:redact .45s var(--d) cubic-bezier(.6,0,.2,1) forwards}
@keyframes redact{to{transform:scaleX(1)}}
@keyframes in{to{opacity:1;transform:none}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (max-width:760px){
  #lock{grid-template-columns:1fr;align-items:start;padding-top:22vh}
  .lk-box{padding:0 24px}
}
@media (max-width:400px){
  .lk-box{padding:0 20px}
  .lk-box form{gap:6px}
  .lk-box .bx{width:34px;height:42px;font-size:18px}
  .lk-box .dash{width:12px}
}
@media (prefers-reduced-motion:reduce){.lk-box,.lk-art{animation:none;opacity:1;transform:none}}
</style>

    </form>
    <p class="lk-msg" role="alert"></p>
  </div>
  <div class="lk-art" aria-hidden="true"></div>
</main>
